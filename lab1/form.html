<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма добавления/редактирования</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/img.png">
</head>
<body>
    <header>
        <h2>Заполните поля для добавления/редактирования данных</h2>
    </header>
    <main>
    <form>
        <div>
            <label for="surname">Фамилия</label>
            <input type="text" id="surname" placeholder="Иванов" pattern='[А-яЁё\-]{2,43}' name="surname" required>
        </div>
        <div>
            <label for="name">Имя</label>
            <input type="text" id="name" placeholder="Иван" pattern='[А-яЁё\-]{2,45}' name="name" required>
        </div>
        <div>
            <label for="patronymic">Отчество</label>
            <input type="text" id="patronymic" placeholder="Иванович" pattern='[А-яЁё]{2,45}' name="patronymic">
        </div>
        <div>
            <label for="group">Группа</label>
            <input type="text" id="group" pattern="[A-Z][1-9][0-9][0-9][0-9]" placeholder="P3223" name="group"
                   title="Формат: Латинская заглавная буква и 4 цифры, например R3124" required>
        </div>
        <div>
            <label for="isuId">ИСУ</label>
            <input type="text" id="isuId" pattern="[1-9][0-9][0-9][0-9][0-9][0-9]" placeholder="555555"
                   title="6-ти значный код, начинающийся не с 0" name="isuId" required>
        </div>
        <div>
            <label for="dormitory">Номер общежития</label>
            <input type="number" min="1" id="dormitory" placeholder="3" name="dormitory">
        </div>
        <div>
            <label for="room">Номер комнаты</label>
            <input type="number" min="1" id="room" placeholder="689" name="room">
        </div>
        <div>
            <label for="settlementPeriod">Срок заселения</label>
            <input type="date" min="2000-01-01" id="settlementPeriod" name="settlementPeriod">
        </div>
        <div>
            <label for="isForeign">Иностранный гражданин</label>
            <input type="checkbox" id="isForeign" name="isForeign">
        </div>
        <div>
            <label for="notes">Заметки</label>
            <textarea id="notes" rows="5" maxlength="1000" placeholder="Заметки" name="notes"></textarea>
        </div>
        <div>
            <button type="submit">Отправить</button>
        </div>
    </form>
    <a href="index.html">Вернуться к таблице</a>
    </main>
    <script src="js/db.js"></script>
    <script src="js/form.js"></script>

</body>
</html>
