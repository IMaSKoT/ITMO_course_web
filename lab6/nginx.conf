resolver 127.0.0.11 valid=5s;

upstream java_backend {
    zone java_backend 64k;
    server backend:8080 resolve;
}

upstream node_backend {
    zone node_backend 64k;
    server realtime:4000 resolve;
}

upstream svelte_frontend {
    zone svelte_frontend 64k;
    server frontend:3000 resolve;
}

server {
    listen 80;
    client_max_body_size 2m;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /realtime/internal/ {
        return 404;
    }

    location /realtime/ {
        proxy_pass http://node_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://java_backend;
    }

    location / {
        proxy_pass http://svelte_frontend;
    }
}
