<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список студентов</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/img.png">
</head>
<body>
    <header>
        <h1>Управление студентами</h1>
        <p id="status-message"></p>
    </header>
    <main>
        <h2>Таблица студентов</h2>
        <form id="filters-form">
        <label>
            Группа
            <input type="text" pattern="[A-Z][1-9][0-9][0-9][0-9]" placeholder="P3223" name="group"
                   title="Формат: Латинская заглавная буква и 4 цифры, например R3124">
        </label>
        <label>
            ИСУ
            <input type="text" pattern="[1-9][0-9][0-9][0-9][0-9][0-9]" placeholder="555555"
                   title="6-ти значный код, начинающийся не с 0" name="isuId">
        </label>
        <label>
            Номер общежития
            <input type="number" min="1" placeholder="3" name="dormitory">
        </label>
        <label>
            Комната
            <input type="number" min="1" placeholder="689" name="room">
        </label>
        <label>
            Иностранец
            <select name="isForeign">
                <option value="">Любой</option>
                <option value="true">Да</option>
                <option value="false">Нет</option>
            </select>
        </label>
        <button type="submit">Применить</button>
        <button type="reset">Сбросить</button>
    </form>
        <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>ФИО</th>
                    <th>Группа</th>
                    <th>ИСУ</th>
                    <th>№ общежития</th>
                    <th>Комната</th>
                    <th>Срок заселения</th>
                    <th>Иностранец</th>
                    <th>Заметки</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="students-table-body">
            </tbody>
        </table>
        </div>
        <a href="form.html">Добавить студента</a>
        <script type="module" src="js/list.js"></script>
    </main>
</body>
</html>
