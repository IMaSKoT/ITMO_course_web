<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список студентов</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/image.png">
</head>
<body>
    <header class="topbar">
        <h1>Студенты общежития</h1>
        <div id="user-bar"></div>
    </header>
    <main>
        <p id="status-message" class="status" hidden></p>
        <form id="filters-form">
            <label class="search">
                ФИО
                <input type="search" name="fullName" maxlength="135" placeholder="Иванов">
            </label>
            <label>
                Группа
                <input type="text" pattern="[A-Z][1-9][0-9]{3}" placeholder="P3210" name="group"
                       title="Формат: латинская заглавная буква и 4 цифры, например P3210">
            </label>
            <label>
                ИСУ
                <input type="text" pattern="[1-9][0-9]{5}" placeholder="555555" name="isuId"
                       title="6-ти значный код, начинающийся не с 0">
            </label>
            <label>
                Наличие общежития
                <select name="hasDormitory" id="has-dormitory-filter">
                    <option value="">Любое</option>
                    <option value="true">Есть</option>
                    <option value="false">Нет</option>
                </select>
            </label>
            <label class="dormitory-filter">
                Номер общежития
                <input type="number" min="1" max="999" placeholder="8" name="dormitory">
            </label>
            <label class="dormitory-filter">
                Комната
                <input type="number" min="1" max="9999" placeholder="412" name="room">
            </label>
            <label class="dormitory-filter">
                Дата заселения
                <input type="date" min="2000-01-01" name="settlementPeriod">
            </label>
            <label>
                Иностранец
                <select name="isForeign">
                    <option value="">Любой</option>
                    <option value="true">Да</option>
                    <option value="false">Нет</option>
                </select>
            </label>
            <button type="submit">Применить</button>
            <button type="reset" class="secondary">Сбросить</button>
        </form>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th><button type="button" data-sort="fullName">ФИО</button></th>
                        <th><button type="button" data-sort="group">Группа</button></th>
                        <th><button type="button" data-sort="isuId">ИСУ</button></th>
                        <th><button type="button" data-sort="dormitory">№ общежития</button></th>
                        <th><button type="button" data-sort="room">Комната</button></th>
                        <th><button type="button" data-sort="settlementPeriod">Дата заселения</button></th>
                        <th>Иностранец</th>
                        <th>Заметки</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="students-table-body">
                </tbody>
            </table>
        </div>

        <nav class="pagination">
            <button type="button" id="prev-page" class="secondary">← Назад</button>
            <span id="page-info"></span>
            <button type="button" id="next-page" class="secondary">Вперёд →</button>
            <label>
                На странице
                <select id="page-size">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                </select>
            </label>
        </nav>

        <a href="form.html" class="admin-only" hidden>Добавить студента</a>
    </main>
    <script type="module" src="js/list.js"></script>
</body>
</html>
